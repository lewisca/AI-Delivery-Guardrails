name: Claude

# Optional. Lets you mention @claude in issues and PRs to request changes or
# reviews. Set up by running `/install-github-app` from the Claude Code terminal
# as a repo admin, which also adds the ANTHROPIC_API_KEY secret.
#
# IMPORTANT — the CI-trigger gotcha: by default, commits pushed by a workflow do
# not trigger OTHER workflows. So a branch opened by this action may not fire the
# CI Gate above. Verify the gate actually runs on AI-authored PRs (a custom
# GitHub App token makes its pushes trigger CI); never assume it does.

on:
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, synchronize]

jobs:
  claude:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # claude_args: "--max-turns 5"
